[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpswm"
version = "0.1.0"
description = "Contracts and runtime foundation for a continual personalized semantic world model"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46,<48",
  "hydra-core>=1.3.5",
  "matplotlib>=3.11.1",
  "networkx>=3.6.1",
  "numpy>=2.4.6",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.9.0",
  "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.165.10",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=8,<10",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.3",
]
viz = [
    "jupyterlab>=4.6.3",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "seaborn>=0.13.2",
]
track = [
    "wandb>=0.28.2",
]
sim = [
    "gymnasium>=1.3.0",
    "mujoco>=3.11.0",
]
perception = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.0",
]
findingdory = [
    "datasets>=5,<6",
    "pyarrow>=21,<26",
]
hand-perception = [
    "mediapipe>=0.10,<0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 契约校验器一律用 "守卫条件 -> 要求" 的嵌套 if 表达规范原文
# （安全门、M27 反馈有效性、纠正模式）。压成单个布尔会让安全关键检查更难 review。
"src/cpswm/contracts/*.py" = ["SIM102"]
# 下面两个文件必须逐字保留同形字符样本：它们就是被检测的攻击本身，
# ruff 的 ambiguous-character 告警在这里是预期的。
"src/cpswm/perception_mapping/adapters/validation.py" = ["RUF001", "RUF002"]
"tests/test_major_revision_round3.py" = ["RUF001", "RUF002"]
# 文档生成器包含需原样输出的长篇英文文案、数学符号与排版用 en dash；
# 这些内容不是代码标识符，换成 ASCII 或强拆字符串会改变最终文档排版。
"tools/build_ra_research_proposal*.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
