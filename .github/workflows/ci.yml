name: CI
on: [push, pull_request]
jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra perception --extra hand-perception
      - run: uv run --frozen --extra dev --extra perception --extra hand-perception ruff check src tests
      - run: uv run --frozen --extra dev --extra perception --extra hand-perception ruff format --check src tests
      - run: uv run --frozen --extra dev --extra perception --extra hand-perception mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      # Neural and video tests import torch/cv2 during collection.
      - run: uv sync --frozen --extra dev --extra perception --extra hand-perception
      - name: Collect every test before starting the long regression
        run: uv run --frozen --extra dev --extra perception --extra hand-perception pytest --collect-only -q
      # loadscope keeps module-scoped expensive reports on one worker.  The old
      # default scheduler rebuilt the same SHIFT report once per worker and
      # made the suite exceed the pre-data regression budget.
      - name: Full regression (65 minute execution budget)
        run: timeout 65m uv run --frozen --extra dev --extra perception --extra hand-perception pytest -n auto --dist=loadscope --durations=25 --cov=src --cov-report=term-missing
