[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpswm"
version = "0.1.0"
description = "Contracts and runtime foundation for a continual personalized semantic world model"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3.5",
  "matplotlib>=3.11.1",
  "networkx>=3.6.1",
  "numpy>=2.4.6",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.9.0",
  "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.165.10",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=8,<10",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.3",
]
viz = [
    "jupyterlab>=4.6.3",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "seaborn>=0.13.2",
]
track = [
    "wandb>=0.28.2",
]
sim = [
    "gymnasium>=1.3.0",
    "mujoco>=3.11.0",
]
perception = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

